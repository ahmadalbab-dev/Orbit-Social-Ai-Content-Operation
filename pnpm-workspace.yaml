packages:
  - apps/*
  - packages/*

# pnpm 11 blocks dependency install scripts unless each package is reviewed.
# These packages need their official build steps for Prisma, Next.js, and tests.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
