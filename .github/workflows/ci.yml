name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: social_automation, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/social_automation
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 11.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/api-smoke.mjs
      - run: pnpm --filter @sma/web exec playwright install --with-deps chromium
      - run: pnpm --filter @sma/web test:e2e
      # Runtime dependencies are release blockers. Build-only tooling is
      # monitored separately because some upstream tools have no patched line.
      - run: pnpm audit --prod --audit-level high
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tools/mobile-preview/package-lock.json }
      - run: npm ci --prefix tools/mobile-preview
      - run: npm run typecheck --prefix tools/mobile-preview
      - run: npm test --prefix tools/mobile-preview
      - run: npm run build --prefix tools/mobile-preview
      - run: npm audit --prefix tools/mobile-preview --omit=dev --audit-level low
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-mobile-web-build
          path: tools/mobile-preview/dist
